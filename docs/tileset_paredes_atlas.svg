<text x="507" y="614" font-size="13" fill="#9ce5b5" font-weight="700">LD</text>
<text x="820" y="112" font-size="22" fill="#ffd85e" font-weight="700">Recortes medidos</text>
<text x="820" y="143" font-size="16" fill="#d9e1ef" font-weight="400">W01  (191, 16, 65, 48)</text>
<text x="820" y="169" font-size="16" fill="#d9e1ef" font-weight="400">W02  (191, 80, 65, 48)</text>
<text x="820" y="195" font-size="16" fill="#d9e1ef" font-weight="400">W03  (191, 144, 65, 48)</text>
<text x="820" y="221" font-size="16" fill="#d9e1ef" font-weight="400">W04  (191, 208, 65, 48)</text>
<text x="820" y="247" font-size="16" fill="#d9e1ef" font-weight="400">QE   (48, 16, 16, 48)</text>
<text x="820" y="273" font-size="16" fill="#d9e1ef" font-weight="400">QD   (127, 16, 17, 48)</text>
<text x="820" y="299" font-size="16" fill="#d9e1ef" font-weight="400">IE   (0, 128, 64, 48)</text>
<text x="820" y="325" font-size="16" fill="#d9e1ef" font-weight="400">ID   (112, 128, 64, 48)</text>
<text x="820" y="351" font-size="16" fill="#d9e1ef" font-weight="400">TSE  (0, 64, 17, 48)</text>
<text x="820" y="377" font-size="16" fill="#d9e1ef" font-weight="400">TSD  (160, 64, 16, 48)</text>
<text x="820" y="403" font-size="16" fill="#d9e1ef" font-weight="400">TIE  (0, 208, 17, 48)</text>
<text x="820" y="429" font-size="16" fill="#d9e1ef" font-weight="400">TID  (160, 208, 16, 48)</text>
<text x="820" y="455" font-size="16" fill="#d9e1ef" font-weight="400">LE   (0, 176, 16, 16)</text>
<text x="820" y="481" font-size="16" fill="#d9e1ef" font-weight="400">LD   (160, 176, 16, 16)</text>
<text x="820" y="535" font-size="22" fill="#ffd85e" font-weight="700">Escala da arte atual</text>
<text x="820" y="560" font-size="15" fill="#d9e1ef" font-weight="400">Parede e Mox a 4× apenas para inspeção.</text>
<rect x="820" y="580" width="432" height="210" fill="url(#checker)" />
<svg x="832" y="590" width="256" height="192" viewBox="192 16 64 48" overflow="hidden"><use href="#atlas" /></svg>
<g transform="translate(1152 718) scale(4)"><use href="#mox" /></g>
<path d="M820 782H1252" stroke="#9ce5b5" stroke-dasharray="5 4" />
<rect x="1148" y="710" width="72" height="72" fill="none" stroke="#70e1ff" stroke-dasharray="4 3" />
<text x="820" y="816" font-size="15" fill="#d9e1ef" font-weight="400">Corpo: 64 × 48 px; altura visível de 45 px.</text>
<text x="820" y="841" font-size="15" fill="#d9e1ef" font-weight="400">Mox mostrado: 15 px visíveis / quadro de 16 px.</text>
<text x="820" y="866" font-size="15" fill="#d9e1ef" font-weight="400">Contorno azul: referência de 18 × 18 px.</text>
<text x="24" y="906" font-size="22" fill="#ffd85e" font-weight="700">Regras de montagem</text>
<text x="24" y="936" font-size="15" fill="#d9e1ef" font-weight="400">W01–W04: corpo em x=192, com 64 px úteis. Borda em x=191, usada somente nas quebras expostas.</text>
<text x="24" y="961" font-size="15" fill="#d9e1ef" font-weight="400">QE = últimos 16 px de IE; QD = primeiros 17 px de ID. Acabamentos sobrepostos, sem aumentar o trecho.</text>
<text x="24" y="986" font-size="15" fill="#d9e1ef" font-weight="400">QD ultrapassa a célula 1 px à esquerda; TSE e TIE ultrapassam 1 px à direita. Não perder essas margens ao recortar.</text>
<text x="24" y="1011" font-size="15" fill="#d9e1ef" font-weight="400">Quinas ocupam a célula da extremidade: não acrescentam outra célula ao comprimento. Faces têm três faixas de 16 px.</text>
<text x="24" y="1036" font-size="15" fill="#d9e1ef" font-weight="400">Quatro corpos unidos: 64 + 64 + 64 + 64 = 256 px. Sem sobreposição e sem borda nas emendas.</text>
<text x="24" y="1061" font-size="15" fill="#d9e1ef" font-weight="400">Meta de Mox: 16–18 px de altura visível. O tamanho de colisão e os encaixes com portas ainda não foram definidos.</text>
</g></svg>