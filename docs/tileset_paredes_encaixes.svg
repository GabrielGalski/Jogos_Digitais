<text x="32" y="825" font-size="16" fill="#aebad1">IE + QE no extremo livre</text>
<text x="336" y="825" font-size="16" fill="#aebad1">ID + QD no extremo livre</text>
<text x="624" y="872" font-size="20" fill="#eef2fa">QE = últimos 16 px de IE.</text>
<text x="624" y="910" font-size="20" fill="#eef2fa">QD = primeiros 17 px de ID.</text>
<text x="624" y="948" font-size="17" fill="#70e1ff">Correspondência exata, incluindo transparência.</text>
<text x="624" y="986" font-size="17" fill="#eef2fa">Sobrepor na extremidade sem aumentar o trecho.</text>
