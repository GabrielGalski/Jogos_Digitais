<text x="460" y="1140" font-size="20" fill="#eef2fa">Borda em X − 1; corpo em X.</text>
<text x="460" y="1180" font-size="18" fill="#eef2fa">Dois corpos: 128 px úteis / 129 px visuais com essa borda.</text>
<text x="460" y="1220" font-size="18" fill="#aebad1">QE/QD são quinas completas, diferentes desta coluna de 1 px.</text>
<text x="32" y="1280" font-size="16" fill="#aebad1">Mapeamento visual. Portas, contornos completos e colisões ainda precisam de ensaio no Godot.</text>
